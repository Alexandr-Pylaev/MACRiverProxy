services:
  river_proxy:
    image: mac_riverproxy
    container_name: river_proxy
    build:
      context: .
      dockerfile: MACRiverProxy/Dockerfile
    env_file:
      - .env
    ports: 
      - "80:80"
      - "443:443" # Works only with ENABLE_HTTPS in .env
    volumes: 
      - "./appsettings.json:/app/appsettings.json"
      - "RiverProxyDBs:/app/db/"
      - "./pages/:/app/Pages/:ro"
      - "./certs/:/certs/:ro"
    environment:
      - "Kestrel__Certificates__Default__Path=/certs/cert.pfx"
    restart: unless-stopped
    
volumes:
  RiverProxyDBs:
    