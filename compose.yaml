services:
  river_proxy:
    image: mac_riverproxy
    container_name: river_proxy
    build:
      context: .
      dockerfile: MACRiverProxy/Dockerfile
    env_file:
      - .env
    ports: 
      - "80:80"
      - "443:443" # Works only when HTTPS endpoint is setup
    volumes: 
      - "./appsettings.json:/app/appsettings.json"
      - "./db/:/app/db/"
      - "./pages/:/app/Pages/:ro"
      - "./certs/:/certs/:ro" # Cert should be in format key.pem - key, cert.pem - fullchain/cert
      - "./logs/:/app/logs/"
    restart: unless-stopped
    
volumes:
  RiverProxyDBs:
    