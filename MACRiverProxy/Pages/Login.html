<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>MACRiver Proxy Login page</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="vh-100 d-flex flex-column">

<nav class="navbar bg-body-tertiary">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">MACRiver Proxy</span>
    </div>
</nav>
<div class="container h-100 d-flex flex-column" >
    <div id="error-div" style="padding-top: 1vh;"></div>
    <div class="h-100 d-flex justify-content-center align-items-center">
        <form class="w-25" action="" method="post">
            <div class="mb-3">
                <label for="loginInput" class="form-label">Login</label>
                <input type="text" required class="form-control" id="loginInput" name="loginInput">
            </div>
            <div class="mb-3">
                <label for="passwordInput" class="form-label">Password</label>
                <input type="password" minlength="8" maxlength="63" required class="form-control" id="passwordInput" name="passwordInput">
            </div>
            <input type="hidden" value="LocalAuth" id="authMethod" name="authMethod">
            <div class="d-flex justify-content-center align-items-center">
                <button type="submit" class="btn btn-primary w-100">Submit</button>
            </div>
        </form>
    </div>
</div>
<script>
    var cont = document.getElementById("error-div");
    const urlParams = new URLSearchParams(window.location.search);
    const errors = urlParams.getAll('error');
    for (let error of errors) {
        cont.innerHTML += "<div class=\"alert alert-danger d-flex align-items-center alert-dismissible fade show\" role=\"alert\">\n" +
            "        <svg class=\"bi flex-shrink-0 me-2\" role=\"img\" aria-label=\"Error:\"><use xlink:href=\"#exclamation-triangle-fill\"/></svg>\n" +
            "        <div>\n" +
            "            \n" + error +
            "        </div>\n" +
            "        <button type=\"button\" class=\"btn-close\" data-bs-dismiss=\"alert\" aria-label=\"Close\"></button>\n" +
            "    </div>";
    }
</script>
<svg xmlns="http://www.w3.org/2000/svg" class="d-none">
    <symbol id="exclamation-triangle-fill" viewBox="0 0 16 16">
        <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
    </symbol>
</svg>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
